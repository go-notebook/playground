name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Copied from go-notebook/notebook's ci.yml. Differences: internal/yaegi (a
# patched copy of yaegi's interpreter, Apache-2.0, see its README) is
# outside the coverage gate; the symbol tables must be what `go generate`
# writes; and the page job runs the built page in headless Chromium.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go version
      # Not on Windows: its checkout converts line endings to CRLF.
      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: The WebAssembly core builds
        shell: bash
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/playground && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/playground
          # The core with Ruby cells, which the page loads for a notebook that has one.
          GOOS=js GOARCH=wasm go vet -tags ruby,rbgo_core ./cmd/playground ./engine
          GOOS=js GOARCH=wasm go build -tags ruby,rbgo_core -o /dev/null ./cmd/playground
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | grep -v /internal/yaegi/ | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  generated:
    name: the symbol tables are what go generate writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go generate ./symbols
      - name: No difference
        run: |
          git add -N .
          git diff --exit-code --stat || { echo "::error::symbols/ is not what go generate ./symbols writes: run it and commit"; exit 1; }

  page:
    name: the page runs every example (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build both playgrounds
        run: |
          go run ./cmd/build -o site/statistics --org go-statistics examples/statistics/*.md
          go run ./cmd/build -o site/numerics --org go-numerics examples/numerics/*.md
      - name: Install Playwright and Chromium
        working-directory: web/test
        run: npm install && npx playwright install --with-deps chromium
      - run: node web/test/page.mjs site/statistics
      - run: node web/test/page.mjs site/numerics

  security:
    name: govulncheck + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Fuzz the cell splitter for 60 s
        run: go test -run '^$' -fuzz FuzzSplit -fuzztime 60s ./engine
      - name: Fuzz the SVG sanitizer for 60 s
        run: go test -run '^$' -fuzz FuzzSanitizeSVG -fuzztime 60s ./engine
      - name: Fuzz the edits (the Markdown round trip) for 60 s
        run: go test -run '^$' -fuzz FuzzEdit -fuzztime 60s ./engine

  arch-native:
    name: arch arm64
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go vet ./... && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Vet + test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -short -exec="$q" ./...

  # The GOOS list is derived from `go tool dist list` (internal/vettargets),
  # never written by hand, so a new target is covered without editing this file.
  targets:
    name: list targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - id: m
        run: go run ./internal/vettargets matrix >> "$GITHUB_OUTPUT"

  # go vet type-checks every package and its tests without linking. With
  # rbgo compiling (and so the engine's Ruby side) on every target but
  # plan9 since v0.8.3, `go test -c` per package linked a Ruby interpreter
  # into ~80 test binaries. One job per GOOS keeps the serial vet of each
  # GOARCH short; the old serial job took 38 minutes.
  cross:
    name: compile on every target (${{ matrix.goos }}${{ matrix.goarch && format('/{0}', matrix.goarch) || '' }})
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      # linux has one entry per GOARCH (it was the critical path as one job);
      # the other systems vet all their GOARCHes in one entry (empty goarch).
      - name: go vet ${{ matrix.goos }} ${{ matrix.goarch }}
        run: go run ./internal/vettargets vet ${{ matrix.goos }} ${{ matrix.goarch }}
